name: Collect Kibera news

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours (UTC)
  workflow_dispatch:
  push:
    paths:
      - "scraper/**"
      - ".github/workflows/collect-news.yml"

permissions:
  contents: write

concurrency:
  group: collect-news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test collector
        run: python -m unittest discover -s tests -v

      - name: Collect news
        run: python scraper/collect.py

      - name: Commit updated news
        run: |
          git config user.name "kibera-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update Kibera news $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
